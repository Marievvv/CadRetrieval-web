<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='site.css') }}"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Search</title>

</head>
<body>
<h1>Демонстратор по ИИ инструменту для сравнения геометрии</h1>

<form method="POST">
  <!-- выбор категории -->
  <div>
    <label for="category">Категория модели:</label>
    <select name="category" id="category">
      <option value="">-- Выбрать --</option>
      {% for category in categories %}
      <option value="{{ category }}"
              {% if category == selected_category %}selected{% endif %}>
        {{ category }}
      </option>
      {% endfor %}
    </select>
  </div>
  <!-- кол-во результатов -->
  <div>
    <label for="top_k">Количество совпадений (от 1 до 10):</label>
    <select name="top_k" id="top_k">
      {% for i in range(1, 11) %}
      <option value="{{ i }}" {% if i == top_k %}selected{% endif %}>{{ i }}</option>
      {% endfor %}
    </select>
  </div>

</form>

<!-- список моделей в выбранной категории -->

<!-- результаты поиска -->

</body>
</html>
